http:
  routers:
    unifi:
      rule: "Host(`unifi.sherrill-burt.com`) || Host(`ui.sherrill-burt.com`)"
      entryPoints:
        - websecure
      service: unifi
      tls:
        certResolver: cloudflare
  services:
    unifi:
      loadBalancer:
        serversTransport: unifi-selfsigned
        servers:
          - url: "https://10.5.0.1:443"
  serversTransports:
    unifi-selfsigned:
      insecureSkipVerify: true
